<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Janken GAME</title>
</head>

<body>
  <a href="/logout">ログアウト</a>

  <h1>Janken GAME!</h1>

  <div th:if="${users}">
    <p>エントリー</p>
    <ul>
      <li th:each="userName : ${users}" th:text="${userName}"></li>
    </ul>
  </div>

  <a href="/janken?userHand=Gu">グー</a>
  <a href="/janken?userHand=Gu">チョキ</a>
  <a href="/janken?userHand=Gu">パー</a>

  <div th:if="${userHand}">
    <p>あなたの手 [[${userHand}]]</p>
    <p>相手の手 [[${cpuHand}]]</p>
    <p>結果 [[${result}]]</p>
  </div>
</body>

</html>
