<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Janken GAME</title>
</head>

<body>
  <a href="/logout">ログアウト</a>

  <h1>Janken GAME!</h1>

  <div th:if="${users}">Hi [[${login_user}]]</div>

  <div>
    <h2>エントリー</h2>
    <ul>
      <li th:each="user : ${users}" th:text="${user.userName}"></li>
    </ul>
  </div>

  <h2>試合結果</h2>
  <div th:each="match :${matches}">
    id: [[${match.matchId}]]
    user1: [[${match.user1}]]
    user2: [[${match.user2}]]
    user1Hand: [[${match.user1Hand}]]
    user2Hand: [[${match.user2Hand}]] <br />
  </div>
</body>

</html>
