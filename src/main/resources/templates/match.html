<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Janken GAME</title>
</head>

<body>
  <a href="/logout">ログアウト</a>

  <h1>Match</h1>
  <h2>[[${login_user}]] V.S. [[${user2.userName}]]</h2>

  <div>
    <a th:href="@{/fight(id=${user2.userId},userHand='Gu')}">ぐー</a>
    <a th:href="@{/fight(id=${user2.userId},userHand='Choki')}">ちょき</a>
    <a th:href="@{/fight(id=${user2.userId},userHand='Pa')}">ぱー</a>
    <div th:if="${result}">
      あなたの手 [[${user1_hand}]]<br />
      相手の手 [[${user2_hand}]]<br />
      結果 [[${result}]]<br />
    </div>
  </div>

  <a href="/janken">もどる</a>
</body>

</html>
